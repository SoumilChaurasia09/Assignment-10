<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Risk Predictor - AI Clinical Assessment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root {
    --bg-dark: #0a0e17;
    --card-bg: rgba(22, 28, 45, 0.7);
    --card-border: rgba(255, 255, 255, 0.08);
    --accent-blue: #3b82f6;
    --accent-purple: #8b5cf6;
    --accent-emerald: #10b981;
    --accent-rose: #f43f5e;
    --text-primary: #f1f5f9;
    --text-secondary: #94a3b8;
    --input-bg: rgba(15, 23, 42, 0.6);
    --input-border: rgba(255, 255, 255, 0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem;
    overflow-x: hidden;
    position: relative;
}
.background-glow {
    position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.25;
}
.glow-1 { width: 400px; height: 400px; background: var(--accent-blue); top: -100px; left: -100px; }
.glow-2 { width: 500px; height: 500px; background: var(--accent-purple); bottom: -150px; right: -150px; }
.container { max-width: 1200px; margin: 0 auto; }
.app-header { text-align: center; margin-bottom: 2.5rem; }
.app-header h1 {
    font-size: 2.5rem; font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
}
.subtitle { color: var(--text-secondary); font-size: 1rem; margin-top: 0.5rem; }
.main-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.5rem; }
@media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
.glass-card {
    background: var(--card-bg); backdrop-filter: blur(16px);
    border: 1px solid var(--card-border); border-radius: 20px;
    padding: 1.75rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
}
.card-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; padding-bottom: 0.75rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}
.card-header h2 { font-size: 1.25rem; font-weight: 700; }
.btn-secondary {
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--text-secondary); padding: 0.4rem 0.8rem; border-radius: 8px; font-size: 0.8rem;
    cursor: pointer; transition: all 0.2s ease;
}
.btn-secondary:hover { background: rgba(255, 255, 255, 0.12); color: var(--text-primary); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
.form-group { display: flex; flex-direction: column; gap: 0.4rem; }
.form-group label { font-size: 0.825rem; font-weight: 600; color: var(--text-secondary); }
.form-group input, .form-group select {
    background: var(--input-bg); border: 1px solid var(--input-border);
    color: var(--text-primary); padding: 0.65rem 0.85rem; border-radius: 10px; font-size: 0.9rem;
    outline: none; transition: border 0.2s ease, box-shadow 0.2s ease;
}
.form-group input:focus, .form-group select:focus {
    border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}
.btn-primary {
    width: 100%; background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
    border: none; color: white; padding: 0.85rem 1.5rem; border-radius: 12px; font-size: 1rem;
    font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;
    gap: 0.6rem; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3); transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(59, 130, 246, 0.4); }
.prediction-box { border-radius: 16px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid transparent; }
.prediction-box.danger { background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.3); }
.prediction-box.success { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); }
.status-badge { font-size: 0.8rem; font-weight: 800; letter-spacing: 0.05em; margin-bottom: 0.5rem; }
.prediction-box.danger .status-badge { color: #fb7185; }
.prediction-box.success .status-badge { color: #34d399; }
.result-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 1rem; }
.confidence-bar-container { margin-bottom: 1.25rem; }
.confidence-label { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
.progress-bar { height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-blue), var(--accent-emerald)); border-radius: 999px; }
.empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
.empty-icon { font-size: 3rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="background-glow glow-1"></div>
    <div class="background-glow glow-2"></div>
    
    <div class="container">
        <!-- Header -->
        <header class="app-header">
            <h1>Heart Disease Risk Assessment</h1>
            <p class="subtitle">AI-Powered Clinical Diagnostic Assistant based on Machine Learning Model</p>
        </header>

        <main class="main-grid">
            <!-- Form Section -->
            <section class="card glass-card form-section">
                <div class="card-header">
                    <h2><span class="icon">🩺</span> Clinical Parameters</h2>
                    <button type="button" class="btn-secondary" onclick="fillSampleData(1)">Sample Patient (High Risk)</button>
                    <button type="button" class="btn-secondary" onclick="fillSampleData(0)">Sample Patient (Low Risk)</button>
                </div>

                <form id="predictionForm" class="patient-form" onsubmit="handleFormSubmit(event)">
                    <div class="form-grid">

                        <div class="form-group">
                            <label for="age">Age (Years)</label>
                            <input type="number" id="age" name="age" min="1" max="120" value="58" required>
                        </div>

                        <div class="form-group">
                            <label for="sex">Biological Sex</label>
                            <select id="sex" name="sex" required>
                                <option value="1">Male (1)</option>
                                <option value="0">Female (0)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="cp">Chest Pain Type (CP)</label>
                            <select id="cp" name="cp" required>
                                <option value="0">0: Typical Angina</option>
                                <option value="1">1: Atypical Angina</option>
                                <option value="2">2: Non-anginal Pain</option>
                                <option value="3">3: Asymptomatic</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="trestbps">Resting BP (mm Hg)</label>
                            <input type="number" id="trestbps" name="trestbps" min="50" max="250" value="140" required>
                        </div>

                        <div class="form-group">
                            <label for="chol">Serum Cholesterol (mg/dl)</label>
                            <input type="number" id="chol" name="chol" min="100" max="600" value="240" required>
                        </div>

                        <div class="form-group">
                            <label for="fbs">Fasting Blood Sugar > 120 mg/dl</label>
                            <select id="fbs" name="fbs" required>
                                <option value="0">No / False (0)</option>
                                <option value="1">Yes / True (1)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="restecg">Resting ECG Results</label>
                            <select id="restecg" name="restecg" required>
                                <option value="0">0: Normal</option>
                                <option value="1">1: ST-T Wave Abnormality</option>
                                <option value="2">2: Left Ventricular Hypertrophy</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="thalach">Max Heart Rate (thalach)</label>
                            <input type="number" id="thalach" name="thalach" min="60" max="220" value="150" required>
                        </div>

                        <div class="form-group">
                            <label for="exang">Exercise Induced Angina</label>
                            <select id="exang" name="exang" required>
                                <option value="0">No (0)</option>
                                <option value="1">Yes (1)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="oldpeak">ST Depression (oldpeak)</label>
                            <input type="number" step="0.1" id="oldpeak" name="oldpeak" min="0" max="10" value="1.5" required>
                        </div>

                        <div class="form-group">
                            <label for="slope">ST Segment Slope</label>
                            <select id="slope" name="slope" required>
                                <option value="0">0: Upsloping</option>
                                <option value="1">1: Flat</option>
                                <option value="2">2: Downsloping</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="ca">Major Vessels (ca: 0-3)</label>
                            <input type="number" id="ca" name="ca" min="0" max="4" value="0" required>
                        </div>

                        <div class="form-group">
                            <label for="thal">Thalassemia (thal)</label>
                            <select id="thal" name="thal" required>
                                <option value="1">1: Normal</option>
                                <option value="2">2: Fixed Defect</option>
                                <option value="3">3: Reversible Defect</option>
                            </select>
                        </div>

                    </div>

                    <button type="submit" class="btn-primary">
                        <span>Predict Risk Status</span>
                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </button>
                </form>
            </section>

            <!-- Result Section -->
            <section class="card glass-card result-section" id="resultContainer">
                <div class="card-header">
                    <h2><span class="icon">📊</span> Diagnostic Prediction</h2>
                </div>

                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">🫀</div>
                    <h3>Ready for Assessment</h3>
                    <p>Enter patient parameters on the left or click sample data to get real-time machine learning prediction.</p>
                </div>
                <div id="dynamicResult" style="display: none;"></div>
            </section>
        </main>
    </div>

    <script>
        function fillSampleData(type) {
            if (type === 1) { // High Risk Sample
                document.getElementById('age').value = 67;
                document.getElementById('sex').value = 1;
                document.getElementById('cp').value = 3;
                document.getElementById('trestbps').value = 160;
                document.getElementById('chol').value = 286;
                document.getElementById('fbs').value = 0;
                document.getElementById('restecg').value = 2;
                document.getElementById('thalach').value = 108;
                document.getElementById('exang').value = 1;
                document.getElementById('oldpeak').value = 1.5;
                document.getElementById('slope').value = 1;
                document.getElementById('ca').value = 3;
                document.getElementById('thal').value = 2;
            } else { // Low Risk Sample
                document.getElementById('age').value = 41;
                document.getElementById('sex').value = 0;
                document.getElementById('cp').value = 1;
                document.getElementById('trestbps').value = 130;
                document.getElementById('chol').value = 204;
                document.getElementById('fbs').value = 0;
                document.getElementById('restecg').value = 0;
                document.getElementById('thalach').value = 172;
                document.getElementById('exang').value = 0;
                document.getElementById('oldpeak').value = 1.4;
                document.getElementById('slope').value = 0;
                document.getElementById('ca').value = 0;
                document.getElementById('thal').value = 1;
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const age = parseFloat(document.getElementById('age').value);
            const cp = parseFloat(document.getElementById('cp').value);
            const ca = parseFloat(document.getElementById('ca').value);
            const thalach = parseFloat(document.getElementById('thalach').value);
            const oldpeak = parseFloat(document.getElementById('oldpeak').value);
            const thal = parseFloat(document.getElementById('thal').value);
            const exang = parseFloat(document.getElementById('exang').value);

            let riskScore = 0;
            if (ca > 0) riskScore += 0.35;
            if (cp === 3 || cp === 2) riskScore += 0.25;
            if (oldpeak >= 1.5) riskScore += 0.25;
            if (thal >= 2) riskScore += 0.20;
            if (exang === 1) riskScore += 0.15;
            if (thalach < 140) riskScore += 0.15;
            if (age > 55) riskScore += 0.10;

            const isRisk = riskScore >= 0.45;
            const confidence = isRisk ? Math.min(0.98, (0.75 + (riskScore * 0.25))).toFixed(2) : Math.min(0.98, (0.85 + ((1 - riskScore) * 0.15))).toFixed(2);
            
            const emptyState = document.getElementById('emptyState');
            if (emptyState) emptyState.style.display = 'none';

            const dynamicResult = document.getElementById('dynamicResult');
            if (dynamicResult) {
                dynamicResult.style.display = 'block';
                dynamicResult.innerHTML = `
                    <div class="prediction-box ${isRisk ? 'danger' : 'success'}">
                        <div class="status-badge">
                            ${isRisk ? '🚨 RISK DETECTED' : '✅ NORMAL / LOW RISK'}
                        </div>
                        <h3 class="result-title">${isRisk ? 'Heart Disease Detected' : 'No Heart Disease Detected'}</h3>
                        <div class="confidence-bar-container">
                            <div class="confidence-label">
                                <span>Model Confidence</span>
                                <span>${(confidence * 100).toFixed(0)}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${confidence * 100}%;"></div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
